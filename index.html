<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上音遊譜面下載中心</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; max-width: 650px; margin: 0 auto 20px auto; flex-wrap: wrap; gap: 15px; }
        h1 { margin: 0; color: #1a1a1a; font-size: 24px; }
        .admin-top-right { background: white; padding: 8px 12px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .admin-top-right input { padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; width: 100px; }
        .admin-top-right button { padding: 4px 8px; font-size: 12px; border-radius: 4px; background: #0070f3; color: white; border: none; cursor: pointer; font-weight: bold; }
        .admin-top-right button:hover { background: #0051cb; }
        .admin-status-dot { width: 8px; height: 8px; background: #28a745; border-radius: 50%; display: inline-block; }
        .container { max-width: 650px; margin: 0 auto; }
        .upload-panel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .upload-area { border: 2px dashed #0070f3; background: #f0f7ff; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .upload-area:hover { background: #e1f0ff; }
        .upload-area p { margin: 0; color: #0070f3; font-weight: bold; }
        #fileInput { display: none; }
        .search-box { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; outline: none; transition: 0.3s; }
        .search-box:focus { border-color: #0070f3; }
        .filter-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; }
        .tag { background: #e4e6eb; padding: 6px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; user-select: none; }
        .tag.active { background: #0070f3; color: white; }
        .level-list { display: flex; flex-direction: column; gap: 12px; }
        .level-card { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; }
        .level-info { flex: 1; min-width: 0; padding-right: 10px; }
        .level-info .title { font-size: 18px; font-weight: bold; margin-bottom: 4px; color: #1a1a1a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .level-info .singer { color: #666; font-size: 14px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .difficulty-badges { display: flex; gap: 4px; flex-wrap: wrap; }
        .diff-badge { background: #e8f4ff; color: #0070f3; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; border: 1px solid #b3d7ff; }
        .card-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .btn { background: #0070f3; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .btn:hover { background: #0051cb; }
        .btn-danger { background: #ff4d4f; }
        .btn-danger:hover { background: #d9363e; }
        .btn-secondary { background: #666; font-size: 12px; padding: 4px 8px; }
        .no-result { text-align: center; color: #999; margin-top: 20px; }
        .pagination-container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 25px; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .page-info { font-size: 14px; color: #666; font-weight: bold; }
        .page-size-selector { font-size: 13px; color: #555; }
        .page-size-selector select { padding: 4px 8px; border-radius: 4px; border: 1px solid #ddd; margin-left: 4px; cursor: pointer; }
        .hidden { display: none !important; }
        @media (max-width: 480px) {
            .header-bar { flex-direction: column; align-items: stretch; }
            .admin-top-right { justify-content: space-between; }
            .level-card { flex-direction: column; align-items: flex-start; gap: 12px; }
            .card-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

<div class="header-bar">
    <h1>🎵 線上譜面下載中心</h1>
    <div class="admin-top-right">
        <span id="lockIcon">🔐</span>
        <div id="loginForm" style="display: flex; gap: 4px;">
            <input type="password" id="passwordInput" placeholder="管理密碼...">
            <button onclick="checkPassword()">解鎖</button>
        </div>
        <div id="changePwdForm" class="hidden" style="display: flex; gap: 4px; align-items: center;">
            <span class="admin-status-dot"></span>
            <input type="password" id="newPasswordInput" placeholder="新密碼...">
            <button onclick="changePassword()">改密碼</button>
            <button class="btn-danger" style="background:#ff4d4f; padding: 4px 8px; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="logout()">登出</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="upload-panel">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <p>點擊此處選擇並上傳譜面檔案</p>
            <span style="font-size: 12px; color: #666;">[雲端資料庫版] 支援所有人共享大體積譜面</span>
            <input type="file" id="fileInput" accept=".json" onchange="handleFileUpload(event)">
        </div>
    </div>

    <input type="text" id="searchBar" class="search-box" placeholder="🔍 輸入歌名或歌手進行搜尋...">
    <div id="filterTags" class="filter-tags"></div>

    <div id="levelList" class="level-list"></div>

    <div id="paginationWrapper" class="pagination-container">
        <div class="pagination">
            <button id="prevPageBtn" class="btn btn-secondary" style="font-size:14px; padding:8px 14px;" onclick="changePage(-1)">上一頁</button>
            <span id="pageInfo" class="page-info">第 1 / 1 頁</span>
            <button id="nextPageBtn" class="btn btn-secondary" style="font-size:14px; padding:8px 14px;" onclick="changePage(1)">下一頁</button>
        </div>
        <div class="page-size-selector">
            顯示筆數：
            <select id="pageSizeSelect" onchange="changePageSize()">
                <option value="10" selected>10 筆</option>
                <option value="20">20 筆</option>
                <option value="40">40 筆</option>
                <option value="100">100 筆</option>
            </select>
        </div>
    </div>
</div>

<script>
    // ⚠️ 請在這裡填入你的 Supabase 專案資訊
    const SUPABASE_URL = 'sb_publishable_e4ysiTPliMPHJfZCCbqLVg_cPbEYCOe';
    const SUPABASE_KEY = 'sb_secret_EU7MJbKKJ4RiZ7rtow_cJg_5RIQecFI';
    
    // 初始化 Supabase 客戶端
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (!localStorage.getItem('adminPassword')) {
        localStorage.setItem('adminPassword', '271828128');
    }

    let songData = [];
    let isAdmin = false;
    let currentSingerFilter = "全部";
    let currentPage = 1;
    let itemsPerPage = 10;

    const searchBar = document.getElementById('searchBar');

    window.onload = function() {
        loadSongsFromDB();
    };

    // 讀取線上所有譜面
    async function loadSongsFromDB() {
        try {
            const { data, error } = await supabase
                .from('database') // 對應你目前的資料表名稱 database
                .select('*')
                .order('id', { ascending: false });

            if (error) throw error;

            songData = data || [];
            initTags();
            renderList();
        } catch (error) {
            alert("從雲端載入數據失敗：" + error.message);
        }
    }

    // 上傳檔案與寫入資料
    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const jsonContent = JSON.parse(e.target.result);
                
                let songTitle = jsonContent.name || jsonContent.title;
                let songSinger = jsonContent.singer || jsonContent.artist || jsonContent.author;
                let diffs = [];

                if (jsonContent.charts && typeof jsonContent.charts === 'object') {
                    diffs = Object.keys(jsonContent.charts);
                }

                if (!songTitle) songTitle = file.name.replace(".json", "").replace(".levelpack", "");
                if (!songSinger) songSinger = "未知歌手";
                if (diffs.length === 0) diffs = ["NORMAL"];
                diffs = diffs.map(d => String(d).trim());

                // 1. 先上傳到 Storage
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                
                const { data: storageData, error: storageError } = await supabase.storage
                    .from('charts')
                    .upload(fileName, file);

                if (storageError) throw storageError;

                const { data: urlData } = supabase.storage
                    .from('charts')
                    .getPublicUrl(fileName);
                
                const publicUrl = urlData.publicUrl;

                // 2. 寫入資料庫
                const { error: dbError } = await supabase
                    .from('database') // 對應你的資料表名稱 database
                    .insert([{
                        title: songTitle,
                        singer: songSinger,
                        difficulties: diffs,
                        file_url: publicUrl
                    }]);

                if (dbError) throw dbError;

                alert(`🎉 線上上傳成功！\n🎵 歌名：${songTitle}\n🎤 歌手：${songSinger}`);
                loadSongsFromDB();

            } catch (error) {
                alert("檔案解析或雲端上傳出錯，請確認資料庫已補上 title 欄位且 file_url 名稱正確。");
                console.error(error);
            }
            document.getElementById('fileInput').value = ''; 
        };
        reader.readAsText(file);
    }

    function triggerDownload(url, title) {
        if (!url) return alert("找不到下載檔案連結。");
        const a = document.createElement('a');
        a.href = url;
        a.download = `${title}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // 管理員功能
    function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        if (input === localStorage.getItem('adminPassword')) {
            isAdmin = true;
            document.getElementById('passwordInput').value = '';
            updateAdminUI();
            renderList();
            alert('管理員解鎖成功！');
        } else {
            alert('密碼錯誤！');
        }
    }

    function changePassword() {
        const newPwd = document.getElementById('newPasswordInput').value.trim();
        if (!newPwd) return alert('密碼不能為空！');
        localStorage.setItem('adminPassword', newPwd);
        document.getElementById('newPasswordInput').value = '';
        alert(`密碼已修改！`);
    }

    function logout() {
        isAdmin = false;
        updateAdminUI();
        renderList();
    }

    function updateAdminUI() {
        document.getElementById('loginForm').classList.toggle('hidden', isAdmin);
        document.getElementById('changePwdForm').classList.toggle('hidden', !isAdmin);
    }

    async function deleteSong(id, fileUrl) {
        if (confirm('確定要從雲端刪除這首歌曲嗎？')) {
            try {
                const { error: dbError } = await supabase
                    .from('database')
                    .delete()
                    .eq('id', id);

                if (dbError) throw dbError;

                if (fileUrl) {
                    const fileName = fileUrl.split('/').pop();
                    await supabase.storage.from('charts').remove([fileName]);
                }

                alert("已成功從線上資料庫刪除該譜面！");
                loadSongsFromDB();
            } catch (error) {
                alert("刪除失敗密碼錯誤或權限問題：" + error.message);
            }
        }
    }

    function changePageSize() {
        itemsPerPage = parseInt(document.getElementById('pageSizeSelect').value, 10);
        currentPage = 1; 
        renderList();
    }

    function initTags() {
        const tagsContainer = document.getElementById('filterTags');
        tagsContainer.innerHTML = '';

        const allSpan = document.createElement('span');
        allSpan.className = `tag ${currentSingerFilter === '全部' ? 'active' : ''}`;
        allSpan.innerText = '全部';
        allSpan.onclick = () => filterSinger('全部', allSpan);
        tagsContainer.appendChild(allSpan);

        const singers = [...new Set(songData.map(song => song.singer))];
        singers.forEach(singer => {
            const span = document.createElement('span');
            span.className = `tag ${currentSingerFilter === singer ? 'active' : ''}`;
            span.innerText = singer;
            span.onclick = () => filterSinger(singer, span);
            tagsContainer.appendChild(span);
        });
    }

    function filterSinger(singer, element) {
        currentSingerFilter = singer;
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
        if (element) element.classList.add('active');
        currentPage = 1;
        renderList();
    }

    function renderList() {
        const listContainer = document.getElementById('levelList');
        const keyword = searchBar.value.toLowerCase().trim();

        const filteredSongs = songData.filter(song => {
            const matchesSinger = (currentSingerFilter === "全部" || song.singer === currentSingerFilter);
            const matchesKeyword = ((song.title || '').toLowerCase().includes(keyword) || (song.singer || '').toLowerCase().includes(keyword));
            return matchesSinger && matchesKeyword;
        });

        const totalItems = filteredSongs.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const pageSongs = filteredSongs.slice(startIndex, startIndex + itemsPerPage);

        document.getElementById('pageInfo').innerText = `第 ${currentPage} / ${totalPages} 頁 (共 ${totalItems} 筆)`;
        document.getElementById('prevPageBtn').disabled = (currentPage === 1);
        document.getElementById('nextPageBtn').disabled = (currentPage === totalPages);

        if (pageSongs.length === 0) {
            listContainer.innerHTML = '<div class="no-result">找不到符合的譜面 😭</div>';
            document.getElementById('paginationWrapper').classList.add('hidden');
            return;
        }
        document.getElementById('paginationWrapper').classList.remove('hidden');

        listContainer.innerHTML = pageSongs.map(song => `
            <div class="level-card">
                <div class="level-info">
                    <div class="title">${song.title || '無歌名'}</div>
                    <div class="singer">🎤 ${song.singer || '未知'}</div>
                    <div class="difficulty-badges">
                        ${(song.difficulties || []).map(d => `<span class="diff-badge">${d}</span>`).join('')}
                    </div>
                </div>
                <div class="card-actions">
                    <button class="btn" onclick="triggerDownload('${song.file_url}', '${song.title || 'chart'}')">下載</button>
                    ${isAdmin ? `<button class="btn btn-danger" onclick="deleteSong(${song.id}, '${song.file_url}')">刪除</button>` : ''}
                </div>
            </div>
        `).join('');
    }

    function changePage(direction) {
        currentPage += direction;
        renderList();
    }

    searchBar.addEventListener('input', () => {
        currentPage = 1;
        renderList();
    });
</script>

</body>
</html>
